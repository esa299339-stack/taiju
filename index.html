<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体重管理ノート</title>
<meta name="theme-color" content="#2f6fdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="体重管理">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --text: #1f2933; --sub: #6b7785; --line: #e3e8ee;
    --w: #2f6fdb; --f: #e0742f; --m: #2e9e6a; --accent: #2f6fdb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --card: #1e242b; --text: #e6eaef; --sub: #98a3b0; --line: #2d353e;
      --w: #6b9df0; --f: #f0995e; --m: #5cc495; --accent: #6b9df0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: var(--bg); color: var(--text); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--sub); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat .label { font-size: 12px; color: var(--sub); }
  .stat .val { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .stat .diff { font-size: 12px; margin-top: 2px; color: var(--sub); }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end; }
  label { font-size: 12px; color: var(--sub); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  input { min-width: 0; max-width: 100%; }
  input[type=date] { -webkit-appearance: none; appearance: none; min-height: 39px; text-align: left; display: block; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  input[type=date], input[type=number], input[type=text] {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px;
    background: var(--bg); color: var(--text); width: 100%; }
  .ex { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; color: var(--text);
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .ex input { width: 18px; height: 18px; }
  button { padding: 9px 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); font-weight: 400; font-size: 13px; padding: 6px 10px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { background: transparent; color: var(--sub); border: 1px solid var(--line); font-size: 13px; padding: 6px 12px; font-weight: 500; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chart-box { position: relative; height: 340px; }
  .chart-title { display: flex; justify-content: space-between; align-items: flex-start; }
  #chartCard.full { position: fixed; inset: 0; z-index: 100; margin: 0; border-radius: 0; overflow-y: auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  #chartCard.full .chart-box { height: calc(100dvh - 160px); min-height: 240px; }
  body.noscroll { overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  td.memo { text-align: left; color: var(--sub); font-size: 13px; }
  .del { background: none; color: var(--sub); padding: 2px 6px; font-size: 13px; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .table-scroll { overflow-x: auto; }
  .legend-note { font-size: 12px; color: var(--sub); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>体重管理ノート</h1>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>今日の記録</h2>
    <form id="form">
      <label>日付<input type="date" id="date" required></label>
      <label>体重 (kg)<input type="number" id="weight" step="0.1" min="20" max="300"></label>
      <label>体脂肪率 (%)<input type="number" id="fat" step="0.1" min="1" max="80"></label>
      <label>筋肉量 (kg)<input type="number" id="muscle" step="0.1" min="5" max="150"></label>
      <label class="ex"><input type="checkbox" id="exercise"> 🏃 運動した</label>
      <label>運動時間 (分)<input type="number" id="minutes" step="1" min="0" max="1440"></label>
      <label>運動メモ<input type="text" id="memo" placeholder="例: ジョギング30分"></label>
      <button type="submit">保存</button>
    </form>
  </div>

  <div class="card" id="chartCard">
    <div class="chart-title"><h2>グラフ</h2><button class="ghost" id="expandBtn">⛶ 拡大</button></div>
    <div class="tabs" id="rangeTabs">
      <button data-r="7">1週間</button>
      <button data-r="30" class="on">1ヶ月</button>
      <button data-r="90">3ヶ月</button>
      <button data-r="365">1年</button>
      <button data-r="0">全期間</button>
    </div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div class="legend-note">🏃 = 運動した日</div>
  </div>

  <div class="card">
    <h2>記録一覧</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>日付</th><th>体重</th><th>体脂肪率</th><th>筋肉量</th><th>運動</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <div class="row-btns">
      <button class="ghost" id="exportBtn">CSVで書き出し</button>
      <button class="ghost" id="importBtn">CSVを読み込み</button>
      <input type="file" id="importFile" accept=".csv" hidden>
    </div>
  </div>

  <div class="card">
    <h2>⚙ 設定</h2>
    <form id="settingsForm">
      <label>身長 (cm)<input type="number" id="height" step="0.1" min="100" max="250"></label>
      <label>目標体重 (kg)<input type="number" id="goal" step="0.1" min="20" max="300"></label>
      <button type="submit">設定を保存</button>
    </form>
  </div>
</div>

<script>
const KEY = 'bodyLog.v1';
let data = load();
let range = 30, charts = [];

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} }
const SKEY = 'bodyLog.settings';
let settings = (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch { return {}; } })();
function today() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function sorted() { return Object.keys(data).sort().map(k => ({ date: k, ...data[k] })); }
const num = v => (v === '' || v == null || isNaN(v)) ? null : Number(v);
const fmt = (v, u) => v == null ? '–' : v.toFixed(1) + u;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const $ = id => document.getElementById(id);
$('date').value = today();
$('date').addEventListener('change', fillForm);
function fillForm() {
  const r = data[$('date').value] || {};
  $('weight').value = r.weight ?? ''; $('fat').value = r.fat ?? ''; $('muscle').value = r.muscle ?? '';
  $('exercise').checked = !!r.exercise; $('minutes').value = r.minutes ?? ''; $('memo').value = r.memo ?? '';
}
fillForm();

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const rec = { weight: num($('weight').value), fat: num($('fat').value), muscle: num($('muscle').value),
    exercise: $('exercise').checked, minutes: num($('minutes').value), memo: $('memo').value.trim() };
  if (rec.minutes) rec.exercise = true;
  if (rec.weight == null && rec.fat == null && rec.muscle == null && !rec.exercise) {
    alert('何か1つは入力してください'); return;
  }
  data[$('date').value] = rec; save(); render();
});

function setupTabs(id, attr, cb) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle('on', x === b));
    cb(b.dataset[attr]); drawChart();
  });
}
setupTabs('rangeTabs', 'r', v => range = Number(v));

function renderStats() {
  const rows = sorted(), items = [];
  const lastW = [...rows].reverse().find(r => r.weight != null)?.weight;
  if (settings.height) {
    const h = settings.height / 100;
    const bmi = lastW ? lastW / (h * h) : null;
    const judge = bmi == null ? '' : bmi < 18.5 ? '低体重' : bmi < 25 ? '普通体重' : bmi < 30 ? '肥満(1度)' : '肥満(2度以上)';
    items.push(`<div class="stat"><div class="label">BMI</div><div class="val">${bmi ? bmi.toFixed(1) : '–'}</div><div class="diff">${judge}${judge ? '・' : ''}標準体重 ${(22 * h * h).toFixed(1)}kg</div></div>`);
  }
  if (settings.goal) {
    const left = lastW ? lastW - settings.goal : null;
    const txt = left == null ? '–' : Math.abs(left) < 0.05 ? '達成！' : (left > 0 ? 'あと ' : '') + Math.abs(left).toFixed(1) + '<small style="font-size:14px">kg</small>' + (left < 0 ? ' 下回り' : '');
    items.push(`<div class="stat"><div class="label">🎯 目標 ${settings.goal.toFixed(1)}kg</div><div class="val">${txt}</div></div>`);
  }
  const since = new Date(); since.setDate(since.getDate() - 29);
  const s = since.toISOString().slice(0, 10);
  const recent = rows.filter(r => r.exercise && r.date >= s);
  const total = recent.reduce((a, r) => a + (r.minutes || 0), 0);
  const small = t => `<small style="font-size:14px">${t}</small>`;
  const time = total >= 60 ? `${Math.floor(total / 60)}${small('時間')}${total % 60 ? (total % 60) + small('分') : ''}` : total + small('分');
  items.push(`<div class="stat"><div class="label">🏃 運動日数 (直近30日)</div><div class="val">${recent.length}${small('日')}</div></div>`);
  items.push(`<div class="stat"><div class="label">⏱ 運動時間 (直近30日)</div><div class="val">${time}</div></div>`);
  $('stats').innerHTML = items.join('');
}

function renderList() {
  const rows = sorted().reverse();
  $('list').innerHTML = rows.length ? rows.map(r => `<tr>
    <td>${r.date}</td><td>${fmt(r.weight, 'kg')}</td><td>${fmt(r.fat, '%')}</td><td>${fmt(r.muscle, 'kg')}</td>
    <td class="memo">${r.exercise ? '🏃 ' : ''}${r.minutes ? r.minutes + '分 ' : ''}${escapeHtml(r.memo || '')}</td>
    <td><button class="del" data-d="${r.date}" title="削除">✕</button></td></tr>`).join('')
    : '<tr><td colspan="6" style="text-align:center;color:var(--sub)">まだ記録がありません</td></tr>';
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
$('list').addEventListener('click', e => {
  const d = e.target.dataset.d;
  if (d && confirm(`${d} の記録を削除しますか？`)) { delete data[d]; save(); render(); }
});

// 運動した日のアイコンと帯を描くプラグイン
const exercisePlugin = {
  id: 'exercise',
  afterDatasetsDraw(c) {
    const rows = c.$rows; if (!rows) return;
    const { ctx, chartArea } = c, x = c.scales.x;
    ctx.save(); ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    rows.forEach((r, i) => {
      if (!r.exercise) return;
      const px = x.getPixelForValue(i);
      ctx.fillStyle = 'rgba(46,158,106,0.10)';
      const w = Math.max(4, Math.min(20, chartArea.width / rows.length * 0.8));
      ctx.fillRect(px - w / 2, chartArea.top, w, chartArea.height);
      if (c.$icons) ctx.fillText('🏃', px, chartArea.top + 18);
    });
    ctx.restore();
  }
};

function drawChart() {
  let rows = sorted();
  if (range) {
    const d = new Date(); d.setDate(d.getDate() - range + 1);
    const s = d.toISOString().slice(0, 10);
    rows = rows.filter(r => r.date >= s);
  }
  const labels = rows.map(r => r.date.slice(5).replace('-', '/'));
  const grid = css('--line'), tick = css('--sub');
  const defs = [['weight', '体重', 'kg', '--w', 'y'], ['fat', '体脂肪率', '%', '--f', 'y1'], ['muscle', '筋肉量', 'kg', '--m', 'y']];
  const datasets = defs.map(([k, name, unit, color, axis]) => ({
    label: name, data: rows.map(r => r[k]), borderColor: css(color), backgroundColor: css(color), unit,
    tension: 0.3, spanGaps: true, pointRadius: rows.length > 60 ? 0 : 3, pointHoverRadius: 6, borderWidth: 2.5, yAxisID: axis
  }));
  if (settings.goal && rows.length) datasets.push({
    label: '目標体重', data: rows.map(() => settings.goal), borderColor: css('--w'), backgroundColor: css('--w'), unit: 'kg',
    borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 0, yAxisID: 'y'
  });
  const big = $('chartCard').classList.contains('full');
  charts.forEach(c => c.destroy());
  const c = new Chart($('chart'), {
    type: 'line', data: { labels, datasets }, plugins: [exercisePlugin],
    options: {
      maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: tick, usePointStyle: true, boxHeight: 8, font: { size: big ? 14 : 12 } } },
        tooltip: { callbacks: {
          label: i => i.raw == null ? null : `${i.dataset.label} ${i.raw.toFixed(1)}${i.dataset.unit}`,
          afterBody: items => {
            const r = rows[items[0]?.dataIndex]; if (!r || !r.exercise) return [];
            return ['🏃 運動した' + (r.minutes ? ` ${r.minutes}分` : '') + (r.memo ? '：' + r.memo : '')];
          } } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: tick, maxTicksLimit: big ? 14 : 8 } },
        y: { grid: { color: grid }, ticks: { color: tick, callback: v => v + 'kg' }, grace: '8%' },
        y1: { position: 'right', grid: { drawOnChartArea: false }, ticks: { color: css('--f'), callback: v => v + '%' }, grace: '8%' }
      }
    }
  });
  c.$rows = rows; c.$icons = true; c.update('none');
  charts = [c];
}
$('exportBtn').addEventListener('click', () => {
  const lines = ['date,weight,fat,muscle,exercise,minutes,memo', ...sorted().map(r =>
    [r.date, r.weight ?? '', r.fat ?? '', r.muscle ?? '', r.exercise ? 1 : 0, r.minutes ?? '', '"' + (r.memo || '').replace(/"/g, '""') + '"'].join(','))];
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `体重記録_${today()}.csv`; a.click();
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const text = (await f.text()).replace(/^﻿/, '');
  let n = 0;
  text.split(/\r?\n/).slice(1).forEach(line => {
    const m = line.match(/^(\d{4}-\d{2}-\d{2}),([^,]*),([^,]*),([^,]*),([^,]*),(?:(\d*),(?="))?"?(.*?)"?$/);
    if (!m) return;
    data[m[1]] = { weight: num(m[2]), fat: num(m[3]), muscle: num(m[4]), exercise: m[5] === '1',
      minutes: num(m[6]), memo: m[7].replace(/""/g, '"') }; n++;
  });
  save(); render(); alert(`${n}件読み込みました`); e.target.value = '';
});

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawChart);
$('height').value = settings.height ?? ''; $('goal').value = settings.goal ?? '';
$('settingsForm').addEventListener('submit', e => {
  e.preventDefault();
  settings = { height: num($('height').value), goal: num($('goal').value) };
  try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch {}
  render();
});
$('expandBtn').addEventListener('click', () => {
  const on = $('chartCard').classList.toggle('full');
  document.body.classList.toggle('noscroll', on);
  $('expandBtn').textContent = on ? '✕ 閉じる' : '⛶ 拡大';
  drawChart();
});
window.addEventListener('resize', () => charts.forEach(c => c.resize()));
function render() { renderStats(); renderList(); drawChart(); }
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
